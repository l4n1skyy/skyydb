# Datasette settings for this folder. `skyydb` starts Datasette with this folder,
# which loads every *.db here plus this file, metadata.yaml, plugins/,
# templates/ and static/. The day-to-day pages (/, /hsk, /workouts,
# /finance, /quotes, /thoughts, /work, /settings) come from plugins/app.py; Datasette's own
# pages are for raw rows (listed on Settings).
# Datasette only listens on 127.0.0.1, so "everyone" below means you on this laptop.

settings:
  default_page_size: 50

# Datasette's own pages in the app's colours (static/datasette.css, served by plugins/app.py)
extra_css_urls: [/theme/datasette.css]

# Lets you add, edit and delete rows from the table pages
permissions:
  insert-row: true
  update-row: true
  delete-row: true

databases:
  chinese:
    tables:
      words:
        facets: [status, hsk]
        label_column: character
        column_types:
          notes: textarea
      study_log:
        sort_desc: id
      statuses: {hidden: true}
      types: {hidden: true}
      categories: {hidden: true}
  workouts:
    tables:
      sets:
        sort_desc: id
        facets: [exercise, date]
      exercises: {hidden: true}
      settings: {hidden: true}
      strava_activities:
        sort_desc: start
        facets: [sport]
  finance:
    tables:
      expenses:
        sort_desc: date
        facets: [category]
      balances:
        sort_desc: date
        facets: [account]
        column_types:
          notes: textarea
      trades:
        sort_desc: date
        facets: [ticker, side]
      conversions:
        sort_desc: date
      prices:
        sort_desc: date
        facets: [ticker]
      settings: {hidden: true}
      categories: {hidden: true}
      accounts: {hidden: true}
  quotes:
    tables:
      quotes:
        sort_desc: id
        column_types:
          text: textarea
          notes: textarea
      quote_tags:
        facets: [tag]
  thoughts:
    tables:
      thoughts:
        sort_desc: id
        column_types:
          text: textarea
      thought_tags:
        facets: [tag]
  elearn:
    tables:
      stream_items:
        sort_desc: posted_at
        facets: [kind, course]
        column_types:
          content: textarea
      scrapes:
        sort_desc: id
  work:
    tables:
      tasks:
        sort: due
        facets: [course_id, status, priority]
        column_types:
          notes: textarea
